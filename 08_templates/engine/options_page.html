<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* SGMM decision sheet: one dark brand look; one band per scene, three option columns with a player and key frames each; stacks on a phone */
:root{
  --void:#050807; --ink:#F2F5F3; --fog:#7C8A84; --rule:rgba(124,138,132,.24); --green:#00E676; --amber:#FFB547;
  --title:"Space Grotesk", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace; --math:"STIX Two Text", "Times New Roman", serif;
  color-scheme:dark;
}
body{background:var(--void);color:var(--ink);font:400 14px/1.55 var(--mono);margin:0}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px;max-width:1280px;margin:0 auto;display:grid;gap:36px}
header{display:grid;gap:12px;max-width:80ch}
.kick{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
h1{font:700 clamp(28px,5vw,46px)/1.05 var(--title);margin:0;text-wrap:balance}
.status{font:500 12px/1 var(--mono);color:var(--void);background:var(--amber);padding:7px 10px;border-radius:2px;justify-self:start;letter-spacing:.06em;text-transform:uppercase}
p{margin:0}.lede{color:var(--fog)}
.scene{display:grid;gap:14px;border-top:1px solid var(--rule);padding-top:20px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h2{font:700 26px/1.1 var(--title);margin:0}
.meta{color:var(--fog);font-variant-numeric:tabular-nums}
.say{max-width:80ch}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:grid;gap:8px;align-content:start;min-width:0;border:1px solid var(--rule);padding:12px;border-radius:2px}
.opt h3{font:700 17px/1.2 var(--title);margin:0}
.opt h3 b{font:italic 400 22px/1 var(--math);margin-right:6px}
.player canvas{width:100%;aspect-ratio:9/16;background:#000;border:1px solid var(--rule);display:block}
.ctl{display:flex;gap:8px;align-items:center}
button{font:700 12px/1 var(--mono);color:var(--void);background:var(--ink);border:0;padding:9px 12px;border-radius:2px;cursor:pointer;min-width:64px}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.keys canvas{width:100%;aspect-ratio:9/16;background:#000;border:1px solid var(--rule);display:block;cursor:pointer}
.note{font-size:12.5px;color:var(--ink)}
.tags{font-size:11px;color:var(--fog)}
</style>

<div class="wrap">
  <header>
    <div class="kick">__KICK__</div>
    <h1>Pick one option per scene</h1>
    <div class="status">__STATUS__</div>
    <p class="lede">__LEDE__</p>
  </header>
  <div id="scenes"></div>
</div>
<script>__LIBS__</script>
<script>
const OPT=window.__OPT__,S=OPT.scenes,fmt=t=>t.toFixed(1)+' s',cards=[];
const box=document.getElementById('scenes');
for(const sc of S){const sec=document.createElement('section');sec.className='scene';
  const lines=OPT.CAPS[sc.id].map(c=>c[2].replace(/\n/g,' ').replace(/[\[\]*{}]/g,'')).join(' / ');
  sec.innerHTML=`<div class="shead"><h2>${sc.label}</h2><span class="meta">${sc.act} · ${sc.lines} · ${fmt(sc.dur)}</span></div><p class="say">“${lines}”</p><div class="opts"></div>`;
  const opts=sec.querySelector('.opts');
  sc.options.forEach((o,i)=>{const L='ABCDE'[i],el=document.createElement('div');el.className='opt';
    el.innerHTML=`<h3><b>${L}</b>${o.name}</h3><div class="player"><canvas width="360" height="640" aria-label="${sc.label} option ${L}"></canvas></div>
      <div class="ctl"><button type="button">Play</button><input type="range" min="0" max="${sc.dur}" step="0.01" value="${o.keys[1]}" aria-label="${sc.label} option ${L} time"></div>
      <div class="keys">${o.keys.map(t=>`<canvas width="180" height="320" data-t="${t}" aria-label="${fmt(t)}"></canvas>`).join('')}</div><p class="note">${o.note}</p>`;
    opts.appendChild(el);
    const cv=el.querySelector('.player canvas'),x=cv.getContext('2d'),sc2=el.querySelector('input'),pb=el.querySelector('button');let playing=false,t0=0,from=+sc2.value,raf=0;
    const show=t=>{x.setTransform(cv.width/1080,0,0,cv.height/1920,0,0);x.save();o.draw(x,Math.min(t,sc.dur-1e-3));x.restore();sc2.value=t};
    const loop=now=>{const t=from+(now-t0)/1000;if(t>=sc.dur){from=0;t0=now;show(0)}else show(t);raf=requestAnimationFrame(loop)};
    const stop=()=>{if(!playing)return;playing=false;cancelAnimationFrame(raf);from=+sc2.value;pb.textContent='Play'};
    pb.onclick=()=>{if(playing)return stop();playing=true;t0=performance.now();pb.textContent='Pause';raf=requestAnimationFrame(loop)};
    sc2.oninput=()=>{stop();from=+sc2.value;show(from)};
    el.querySelectorAll('.keys canvas').forEach(k=>{cards.push([sc,i,o,k]);k.onclick=()=>{stop();from=+k.dataset.t;show(from)}});
    el._show=show;});
  box.appendChild(sec);}
const F=['700 58px "Space Grotesk"','500 40px "JetBrains Mono"','700 40px "JetBrains Mono"','700 40px "Space Grotesk"','500 20px "Space Grotesk"','400 120px "Anton"','700 34px "Oswald"','700 34px "Libre Baskerville"','400 11px "Libre Baskerville"','400 52px "STIX Two Text"','italic 400 52px "STIX Two Text"'];
Promise.race([Promise.all(F.map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,5000))]).catch(()=>{}).then(async()=>{
  document.querySelectorAll('.opt').forEach(el=>el._show(+el.querySelector('input').value));
  for(const [sc,i,o,k] of cards){const x=k.getContext('2d');x.setTransform(k.width/1080,0,0,k.height/1920,0,0);x.save();o.draw(x,+k.dataset.t);x.restore();await new Promise(r=>setTimeout(r,0))}
  window.__ready=true;});
/* headless Chrome: one PNG, a row per scene, 3 options x their key frames */
window.outputs=async()=>{const w=180,h=320,p=10,lh=34,cols=3*4,cv=document.createElement('canvas');cv.width=p+Math.max(...S.map(s=>s.options.length))*(4*(w+6)+24);cv.height=S.length*(h+lh+56)+p;const c=cv.getContext('2d');
  c.fillStyle='#050807';c.fillRect(0,0,cv.width,cv.height);c.textBaseline='top';
  S.forEach((sc,r)=>{const y0=p+r*(h+lh+56);c.fillStyle='#F2F5F3';c.font='700 26px "Space Grotesk"';c.fillText(`${sc.label} · ${sc.act}`,p,y0+6);
    sc.options.forEach((o,i)=>{const x0=p+i*(4*(w+6)+24);c.fillStyle='#7C8A84';c.font='500 14px "JetBrains Mono"';c.fillText(`${'ABCDE'[i]} · ${o.name}`,x0,y0+40+h+6);
      cards.filter(q=>q[0]===sc&&q[1]===i).forEach(([, , ,k],j)=>c.drawImage(k,x0+j*(w+6),y0+40,w,h))})});
  return{options:cv.toDataURL('image/png')}};
</script>
