<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=block">
<canvas id="c"></canvas>
<script>
/* SGMM thumbnail system (approved for EP000). `sgmm package` fills window.MARK_D (from 01_brand/logo/svg/SGMM_mark_green.svg),
   window.IMG {name: dataURL} and window.SPEC (the plan's publish.thumbs); window.outputs() returns {kind: PNG dataURL} at 3x.
   Text: "[word]" = the one green element. Missing SPEC keys fall back to EP000's words. */
const MARK=new Path2D(window.MARK_D);
const G='#00E676',V='#050807',W='#F2F5F3',A='#FFB547',F='#0B3D2E',FOG='#7C8A84';
const TITLE='"Space Grotesk", sans-serif',MONO='"JetBrains Mono", monospace';
const EP000={A:{small:'THE WORLD IS BEING',big:'REWRITTEN.'},B:{frame:'B',y:500,lines:['[RE]','[WRITTEN.]']},C:{frame:'C',y:656,lines:['WHAT','[NEXT?]']},
  vertical:{lines:['THE','WORLD','IS BEING'],big:['RE-','WRITTEN.']}};
function mark(c,x,y,s,col){c.save();c.translate(x,y);c.scale(s/984,s/984);c.translate(0,18);c.fillStyle=col;c.fill(MARK,'evenodd');c.restore()}
function grid(c,w,h,cols){c.strokeStyle='rgba(124,138,132,.09)';c.lineWidth=1.5;for(let i=1;i<cols;i++){const x=w*i/cols;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=h/8;y<h;y+=h/8){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}
function kicker(c,x,y,px){c.font='700 '+px+'px '+MONO;c.textBaseline='alphabetic';let xx=x;for(const [t,col] of [['THEN',A],['  ·  ',FOG],['NOW',W],['  ·  ',FOG],['NEXT',G]]){c.fillStyle=col;c.fillText(t,xx,y);xx+=c.measureText(t).width}}
/* a line in Space Grotesk, white unless [bracketed]; shrinks to fit maxw */
function line(c,s,x,y,px,maxw,col){const green=s[0]==='[',t=green?s.slice(1,-1):s;c.font='700 '+px+'px '+TITLE;const w=c.measureText(t).width;if(w>maxw){px=px*maxw/w;c.font='700 '+px+'px '+TITLE}c.fillStyle=col||(green?G:W);c.fillText(t,x,y)}
function img(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=window.IMG[src]})}
async function draw(kind){const S={...EP000[kind],...((window.SPEC||{})[kind]||{})};
 const cv=document.getElementById('c');const v=kind==='vertical';const w=v?1080:1280,h=v?1920:720,K=3;cv.width=w*K;cv.height=h*K;const c=cv.getContext('2d');c.setTransform(K,0,0,K,0,0);
 c.fillStyle=V;c.fillRect(0,0,w,h);
 if(kind==='A'){grid(c,w,h,12);c.fillStyle=G;c.beginPath();c.arc(1150,170,300,0,7);c.fill();
   kicker(c,72,96,30);line(c,S.small,68,430,64,1140,W);line(c,S.big,60,580,168,1150,G);mark(c,72,622,64,G)}
 if(kind==='B'||kind==='C'){const im=await img(S.frame);c.drawImage(im,0,S.y,1080,608,0,0,1280,720);
   const g=c.createLinearGradient(0,0,1280,0);
   if(kind==='B'){g.addColorStop(0,'rgba(5,8,7,.96)');g.addColorStop(.46,'rgba(5,8,7,.82)');g.addColorStop(.75,'rgba(5,8,7,.15)');g.addColorStop(1,'rgba(5,8,7,0)')}
   else{g.addColorStop(0,'rgba(5,8,7,.95)');g.addColorStop(.5,'rgba(5,8,7,.75)');g.addColorStop(1,'rgba(5,8,7,.05)')}
   c.fillStyle=g;c.fillRect(0,0,1280,720);kicker(c,72,96,30);
   const y0=kind==='B'?420:400,dy=kind==='B'?140:145;S.lines.forEach((s,i)=>line(c,s,64,y0+i*dy,150,1150));
   c.fillStyle=V;c.fillRect(56,610,96,92);mark(c,72,622,64,G)}
 if(kind==='vertical'){grid(c,w,h,6);c.fillStyle=G;c.beginPath();c.arc(980,330,360,0,7);c.fill();
   kicker(c,80,250,40);S.lines.forEach((t,i)=>line(c,t,72,760+i*160,150,940,W));
   S.big.forEach((t,i)=>line(c,t,72,1250+i*170,172,940,G));mark(c,80,1520,110,G)}
 return cv.toDataURL('image/png')}
window.outputs=async()=>{const o={};for(const k of ['A','B','C','vertical'])o[k]=await draw(k);return o};
Promise.all(['700 100px "Space Grotesk"','700 30px "JetBrains Mono"'].map(f=>document.fonts.load(f))).then(()=>window.__ready=true);
</script>
